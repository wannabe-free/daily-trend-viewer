name: 트렌드 수집 및 Pages 배포

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 UTC 22:00 = 다음 날 한국 시간 07:00 (실행 지연 가능)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 공개 페이지 브라우저 수집 준비
        run: |
          python3 -m pip install 'playwright>=1.55,<2'
          python3 -m playwright install --with-deps chromium
      - name: 릴스 파서 검증
        run: python3 -m unittest -v test_instagram_reels.py
      - name: 데이터 수집 및 정적 사이트 생성
        env:
          PAGES_BASE: https://wannabe-free.github.io/daily-trend-viewer/
          IG_BROWSER_FALLBACK: "1"
        run: python3 -u collect.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
